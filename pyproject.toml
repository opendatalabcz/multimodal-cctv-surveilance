[project]
name = "multimodal-cctv-surveilance"
version = "0.1.0"
description = "Multimodal CCTV surveillance analysis from public camera feeds"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "accelerate",
    "aiohttp",
    "bitsandbytes",
    "huggingface-hub",
    "matplotlib",
    "open-clip-torch",
    "pandas",
    "pillow",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "requests",
    "torch",
    "torchvision",
    "transformers",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cctv"]

[tool.hatch.build.targets.wheel.force-include]
"src/cctv/prompts/template.md" = "cctv/prompts/template.md"
"src/cctv/prompts/fillers" = "cctv/prompts/fillers"
"src/cctv/fetch/monitor_config.json" = "cctv/fetch/monitor_config.json"

[tool.uv]
package = true
