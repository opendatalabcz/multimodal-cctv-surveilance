[project]
name = "multimodal-cctv-surveilance"
version = "0.1.0"
description = "Multimodal CCTV surveillance analysis from public camera feeds"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp",
    "fastapi",
    "pillow",
    "ddgs",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "requests",
    "uvicorn[standard]",
    "yt-dlp",
    "imageio-ffmpeg",
]

[project.scripts]
cctv-api = "cctv.api.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cctv"]

[tool.hatch.build.targets.wheel.force-include]
"src/cctv/fetch/monitor_config.json" = "cctv/fetch/monitor_config.json"

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "integration: tests that call live external services",
]
